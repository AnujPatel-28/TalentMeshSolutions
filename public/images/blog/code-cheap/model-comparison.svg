<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"><rect width="1000" height="360" rx="16" fill="#eaf2f6"/><g font-family="Arial" fill="#071a2b"><text x="90" y="70" font-size="24" font-weight="700">Cloud frontier model</text><text x="570" y="70" font-size="24" font-weight="700">Small / local model</text><rect x="70" y="105" width="370" height="145" rx="12" fill="white" stroke="#d8e2e9"/><rect x="560" y="105" width="370" height="145" rx="12" fill="white" stroke="#0878b5" stroke-width="3"/><g font-size="19" fill="#4b5d6c"><text x="100" y="145">Broad capability</text><text x="100" y="180">Cloud scale · higher cost</text><text x="100" y="215">Open-ended work</text><text x="590" y="145">Narrow capability</text><text x="590" y="180">Local control · low latency</text><text x="590" y="215">Focused workflows</text></g><text x="500" y="310" text-anchor="middle" font-size="18" fill="#4b5d6c">Choose the smallest system that reliably solves the problem.</text></g></svg>